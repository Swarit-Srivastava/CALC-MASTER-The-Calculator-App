<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CALC MASTER</title>
</head>
<body>
    <div class="navbar">
        <nav>
            <img src="Calc Master logo.png" alt="">
            <h1> CALC MASTER</h1>
            <ul>
                <button class="a active"><a href="index.html">Home</a></button>
                <button class="a"><a href="About.html">About</a></button>
                <button class="a"><a href="Contact.html">Contact</a></button>
            </ul>
        </nav>
    </div>
    <div class="calculator">
        <input id="inputBox" type="text" placeholder="0">
        <div>
            <button class="o z">AC</button>
            <button class="o z">DEL</button>
            <button class="o z">%</button>
            <button class="o z">/</button>
        </div>
        <div>
            <button class="o">7</button>
            <button class="o">8</button>
            <button class="o">9</button>
            <button class="o z">x</button>
        </div>
        <div>
            <button class="o">4</button>
            <button class="o">5</button>
            <button class="o">6</button>
            <button class="o z">-</button>
        </div>
        <div>
            <button class="o">1</button>
            <button class="o">2</button>
            <button class="o">3</button>
            <button class="o z">+</button>
        </div>
        <div>
            <button class="o">00</button>
            <button class="o">0</button>
            <button class="o z">.</button>
            <button class="o equal">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
